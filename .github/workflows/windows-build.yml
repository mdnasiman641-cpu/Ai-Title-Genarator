name: Windows build

# Builds and tests the desktop app on a real Windows runner and uploads the .exe as an artifact.
# Every successful build of main is also published as a GitHub Release (a .zip with the .exe):
#   https://github.com/<owner>/<repo>/releases/latest
# Manual run:  Actions -> "Windows build" -> Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # needed to publish the Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build (runs the tests, PyInstaller, and the exe self-test)
        shell: cmd
        run: build.bat
      - name: Real Whisper check - Python pipeline, Bangla and GUI (downloads Whisper models)
        shell: cmd
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: .venv\Scripts\python tools\verify_whisper.py --model small --bangla-model large-v3-turbo --data-dir "%RUNNER_TEMP%\aivfa-data" --report whisper-report.json
      - name: Real Whisper check - the built .exe transcribes real speech
        shell: pwsh
        run: |
          $env:AIVFA_DATA_DIR = "$env:RUNNER_TEMP\aivfa-data"
          $exe = "dist\AI Video File Assistant\AI Video File Assistant.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--transcribe", "tests\data\jfk_speech.mp4", "--out", "exe-transcript.json" -Wait -PassThru
          Get-Content exe-transcript.json -Encoding utf8
          $report = Get-Content exe-transcript.json -Encoding utf8 | ConvertFrom-Json
          if ($p.ExitCode -ne 0 -or $report.status -ne "ok" -or $report.text -notmatch "country") { throw "the built exe did not transcribe the speech (exit $($p.ExitCode), status $($report.status))" }
      - name: Upload the Whisper reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whisper-verification
          path: |
            whisper-report.json
            exe-transcript.json
          if-no-files-found: ignore
      - name: Upload the one-folder build
        uses: actions/upload-artifact@v4
        with:
          name: AI-Video-File-Assistant-windows
          path: dist/AI Video File Assistant
          if-no-files-found: error
      - name: Zip the app for the Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: Compress-Archive -Path "dist/AI Video File Assistant" -DestinationPath "AI-Video-File-Assistant-windows.zip"
      - name: Publish the Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path app/config/constants.py -Pattern '^APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          $tag = "v$version-build.${{ github.run_number }}"
          $notes = "Windows build of commit ${{ github.sha }}.`n`nDownload **AI-Video-File-Assistant-windows.zip**, extract it, and run **AI Video File Assistant.exe** inside the extracted folder (keep the files next to it)."
          gh release create $tag "AI-Video-File-Assistant-windows.zip" --target "${{ github.sha }}" --title "AI Video File Assistant $version (build ${{ github.run_number }})" --notes $notes --latest
